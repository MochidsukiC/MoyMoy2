# MoyMoy backend manifest for the MochiOS app-backend launcher.
#
# Copy this (and the built `moymoy-cs` binary) into the Hub workdir under
# `app_backends/moymoy/`, then enable it in the Hub TUI (or set enabled = true).
# `tools/deploy-backend.ps1` does the copy for you.
#
# tunnel = "self": the backend embeds its own cs tunnel (mochi-hub-cs-sdk), so the
# launcher injects only MOCHI_APP_LISTEN and runs NO tunnel itself (DEV.md §5.4.3).

enabled = true
# The backend's single ingress. Emerald charging is HTTP in MNN over this same
# tunnel, so there is no second connection and no second claim — the sibling
# sub-host split (wallet.moymoy / charge.moymoy) the old command bus needed is
# gone with it.
domain  = "moymoy.cs.mnn"
# `exec` omitted on purpose: the launcher auto-detects the single runnable file in
# this dir (moymoy-cs / moymoy-cs.exe), which is portable across Windows/Unix
# without hardcoding the `.exe` suffix. Add `exec = ["./moymoy-cs"]` to override.
listen_env = "MOCHI_APP_LISTEN"
tunnel  = "self"

[env]
# Wallet store (relative to app_backends/moymoy/).
MOYMOY_DB_PATH = "moymoy.db"
# Serve TLS for path-C (https://moymoy.cs.mnn via the gateway CONNECT tunnel).
MOYMOY_CS_TLS  = "1"

# Embedded cs tunnel → Hub endpoints. These match a local `mochi-inworld` devstack;
# override for a non-local Hub. The handshake bearer is NOT set here: it is this
# process's own per-process identity token (MOCHI_SVC_IDENTITY_TOKEN), minted
# and injected by the hub launcher. The legacy shared MOCHI_TUNNEL_BEARER is
# retired — the Hub derives no principal from it, so presenting it is always
# rejected.
MOCHI_TUNNEL_HUB_WS   = "ws://127.0.0.1:7411"
MOCHI_TUNNEL_HUB_QUIC = "127.0.0.1:7420"
MOCHI_IPVM_ROUTER_URL = "http://127.0.0.1:7400"

# Emerald charge needs NO configuration of its own: it rides the cs tunnel above
# as HTTP in MNN, so there is no command-bus endpoint and no mTLS client
# certificate to mint. `can_charge` simply follows that tunnel's liveness. What
# it still needs is on the Minecraft side: the moymoy mod jar next to the mochi
# connector mod, and a connector configured on that server.

# Email verification / login 2FA / PIN recovery (OPTIONAL). MoyMoy delivers OTP
# codes over the MNN overlay to *.mnn mailboxes (the in-world mail app) — NO
# external SMTP. Delivery authenticates with THIS process's own per-process
# identity token (MOCHI_SVC_IDENTITY_TOKEN), minted and injected by the hub
# launcher — there is nothing to set here. The old shared-secret
# MOCHI_MAIL_SERVICE_BEARER is retired. Since the same token is required just to
# open the embedded cs tunnel (MOYMOY_CS_TUNNEL, default on), a normal
# launcher-run backend always has it, so email verification/2FA/recovery is
# effectively always on in production. It only degrades to handle+PIN in a
# MOYMOY_CS_TUNNEL=0 loopback smoke, which has no identity token to present.
# MOCHI_MAIL_GATEWAY_URL    = "http://127.0.0.1:7411"   # IPvM gateway (default)
# Optional offline-brute-force resistance for the OTP table:
# MOYMOY_OTP_PEPPER = "<random secret>"
# Local testing WITHOUT the mail service: MOYMOY_DEV_OTP_LOG=1 logs the code
# instead of delivering it (dev only — never in a real deploy).
