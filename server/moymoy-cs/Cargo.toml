[package]
name = "moymoy-cs"
version = "0.1.0"
edition = "2021"
description = "MoyMoy cs.mnn wallet backend — serves the wallet (balance/send/request/history) over the MNN overlay (moymoy.cs.mnn) with an EMBEDDED cs tunnel (mochi-hub-cs-sdk), persists to SQLite, and drives emerald charging against the in-world mod as HTTP in MNN over that same tunnel."

# Standalone workspace so this crate resolves independently while path-depending
# into the co-located MochiOS2.0 checkout for the embedded cs tunnel SDK.
# (Mirrors PiggleShop2/server/piggleshop-cs.)
[workspace]

[[bin]]
name = "moymoy-cs"
path = "src/main.rs"

[dependencies]
# Async runtime + HTTP. Versions/features PINNED to match MochiOS2.0's workspace
# so the shared transitive crates (rustls/quinn/ring) unify with the SDK trees.
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tower = { version = "0.5", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
md5 = "0.7"  # Minecraft offline-mode player UUID (nameUUIDFromBytes of "OfflinePlayer:<name>")

# Merchant-name impersonation defence (see src/merchant.rs). Pure lookup tables,
# no runtime deps: NFKC so one name has one form; the UTS #39 confusable skeleton
# so uniqueness is decided on what a name LOOKS like rather than on its code
# points; the restriction level so a Latin/Cyrillic hybrid is refused while a
# normal Japanese name (Han + Hiragana + Katakana + Latin) is not; and the raw
# general category so the invisible classes (Cf bidi controls, unassigned,
# private use) can be refused by what they ARE.
unicode-normalization = "0.1"
unicode-security = "0.1"
unicode-general-category = "1"

# Independent-account auth: Argon2id for PINs (never store plaintext), SHA-256 for
# session-token hashes (fast per-request verify), a CSPRNG for token bytes, and
# base64 for opaque token/hash encoding. All pure-Rust, no ring/system deps.
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# SQLite — bundled so there is no system libsqlite dependency. r2d2 pool for
# read concurrency under WAL; writers serialize on BEGIN IMMEDIATE + busy_timeout.
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# TLS serving for path-C (https://moymoy.cs.mnn end-to-end through the gateway
# CONNECT tunnel). The certificate itself comes from the Hub via
# mochi-hub-cs-sdk (see src/tls.rs) — no local CA/cert minting here, so no
# rcgen dependency.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

# Embedded cs tunnel (the "tunnel-embedded SDK"): claim moymoy.cs.mnn in-process,
# no sidecar (DEV.md §5.4.3 / app.toml tunnel="self"). It also carries the
# outbound emerald-charge requests to the in-world mod as HTTP in MNN
# (MochiOS DEV.md §7.3.10), so this is the ONLY MochiOS transport dependency —
# the exsoft command-bus SDK and its mTLS PKI are no longer used at all.
# Path-dep into the co-located MochiOS2.0 checkout.
mochi-hub-cs-sdk = { path = "../../../MochiOS2.0/hub/cs-sdk" }

# Host attestation (MochiOS DEV.md §7.3.10 G4) — the wire schema, the Ed25519
# verification, the pubkey cache and the challenge store, in the SAME
# implementation the Hub issues with. Deliberately not a Hub component: it pulls
# no async runtime, no HTTP client and no QUIC, so depending on it does not drag
# the Hub into this build. `challenge` adds the single-use nonce store; `issue`
# stays OFF, because a backend that can sign is a backend that can forge the facts
# it is supposed to be checking.
mochi-proto-attest = { path = "../../../MochiOS2.0/protocols/attest", features = ["challenge"] }

# Outbound email (OTP delivery) for account email verification / 2FA / PIN
# recovery. Delivery is over the MNN overlay (`MnnMailSender`, `*.mnn`
# recipients), authenticated with this process's own identity token. Absent
# identity ⇒ email features degrade off.
mochi-hub-mailer = { path = "../../../MochiOS2.0/hub/mailer" }

[dev-dependencies]
# `dev-signer` mints a VALID assertion from a fixed seed, so the accept path — the
# one that decides whether a charge goes through — is testable without running a
# Hub. Test-only by construction: the feature that lets this crate sign is never
# enabled in the build above.
mochi-proto-attest = { path = "../../../MochiOS2.0/protocols/attest", features = ["challenge", "dev-signer"] }
