# MoyMoy — Fabric 26.2 ビルドルート (Gradle 9.5.1 / Loom 1.17 / Java 25)。
# mod/ (ForgeGradle 6 / Gradle 8.8 / JDK 17) とは同居できないため独立したビルドルートにしている。
#
# JDK 25 は Gradle の toolchain 自動検出 (~/.jdks 等) に任せる。検出できない環境では
# このファイルではなく ~/.gradle/gradle.properties に
#   org.gradle.java.home=<JDK 25 のパス>
# を書くこと (リポジトリに個人環境の絶対パスを持ち込まない)。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# mod/gradle.properties の org.gradle.daemon=false は持ち込まない。デーモンを切ると
# Loom のデコンパイル / リマップ結果のインメモリキャッシュが毎回コールドになり、
# ビルドが桁で遅くなる。

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties — check these on https://fabricmc.net/develop
# (MochiOS2.0/minecraft/fabric-26.2 と同一値。~/.gradle/caches に解決済み)
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Dependencies
fabric_api_version=0.156.0+26.2

# Mod identity。connector の app_id も "moymoy"。
# mod_name / mod_description / mod_authors / mod_license は fabric.mod.json に直接書く。
# Forge の mods.toml はプロパティ置換テンプレートだったが、Fabric では ${version} 以外の
# 置換が要らないためプロパティ化しない。
mod_id=moymoy
mod_version=0.1.0+26.2
maven_group=jp.houlab.mochidsuki.moymoy
archives_base_name=moymoy
